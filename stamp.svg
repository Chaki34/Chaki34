<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#5a0000" flood-opacity="0.55"></feDropShadow>
    </filter>
  </defs>

  <g transform="translate(130,130) rotate(-18)" filter="url(#shadow)">
    <!-- Outer Circle -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="#B30000" stroke-width="7" stroke-opacity="0.85"></circle>

    <!-- Inner Circle -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#B30000" stroke-width="3" stroke-opacity="0.65" stroke-dasharray="6 5"></circle>

    <!-- Top Text -->
    <text x="0" y="-48" text-anchor="middle" font-size="17" font-family="Arial" font-weight="bold" fill="#B30000">
      VERIFIED
    </text>

    <!-- Middle -->
    <text x="0" y="6" text-anchor="middle" font-size="28" font-family="Arial" font-weight="900" fill="#B30000">
      JAVA
    </text>

    <!-- Bottom -->
    <text x="0" y="42" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold" fill="#B30000">
      FULL STACK ENGINEER
    </text>

    <!-- Stars -->
    <text x="-63" y="6" font-size="18" fill="#B30000">★</text>
    <text x="63" y="6" font-size="18" fill="#B30000">★</text>
  </g>
</svg>