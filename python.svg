<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#14532d" flood-opacity="0.45"></feDropShadow>
    </filter>
  </defs>

  <g transform="translate(130,130) rotate(-18)" filter="url(#shadow)">

    <!-- Outer Circle -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="#16A34A" stroke-width="7" stroke-opacity="0.9"></circle>

    <!-- Inner Circle -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#16A34A" stroke-width="3" stroke-dasharray="7 5" stroke-opacity="0.8"></circle>

    <!-- Top Text -->
    <text x="0" y="-48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#16A34A">
      VERIFIED
    </text>

    <!-- Python -->
    <text x="0" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#15803D">
      PYTHON
    </text>

    <!-- Bottom Text -->
    <text x="0" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#16A34A">
      DEVELOPER
    </text>

    <!-- Stars -->
    <text x="-63" y="8" font-size="18" fill="#16A34A">★</text>
    <text x="63" y="8" font-size="18" fill="#16A34A">★</text>

  </g>
</svg>